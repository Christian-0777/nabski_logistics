
name: Discord Release Announcement

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Announce GitHub Release on Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          REPOSITORY: ${{ github.repository }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ.get("DISCORD_BOT_TOKEN", "").strip()
          channel_id = os.environ.get("DISCORD_CHANNEL_ID", "").strip()

          if not token:
              sys.exit("Missing DISCORD_BOT_TOKEN repository secret.")

          if not channel_id.isdigit():
              sys.exit("DISCORD_CHANNEL_ID must be a numeric channel ID.")

          name = os.environ.get("RELEASE_NAME") or os.environ["RELEASE_TAG"]
          tag = os.environ["RELEASE_TAG"]
          url = os.environ["RELEASE_URL"]
          body = os.environ.get("RELEASE_BODY") or "No release notes provided."
          repo = os.environ["REPOSITORY"]
          prerelease = os.environ.get("IS_PRERELEASE", "").lower() == "true"

          # Stay within Discord embed description limits.
          if len(body) > 3500:
              body = body[:3460] + "\n\n… Read the complete notes on GitHub."

          title = f"{'🧪 Beta Release' if prerelease else '🚀 New Release'}: {name}"
          title = title[:256]

          payload = {
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": title,
                  "url": url,
                  "description": body,
                  "color": 15158332 if prerelease else 5763719,
                  "fields": [
                      {
                          "name": "Version",
                          "value": f"`{tag[:200]}`",
                          "inline": True
                      },
                      {
                          "name": "Repository",
                          "value": repo[:1024],
                          "inline": True
                      },
                      {
                          "name": "Release Type",
                          "value": "Beta / Pre-release" if prerelease else "Release",
                          "inline": True
                      }
                  ],
                  "footer": {
                      "text": "NLSI Exclusive Logbook • GitHub Releases"
                  }
              }]
          }

          endpoint = (
              f"https://discord.com/api/v10/channels/"
              f"{channel_id}/messages"
          )

          request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bot {token}",
                  "Content-Type": "application/json",
                  "User-Agent": (
                      "NLSIReleaseBot "
                      "(https://github.com/Christian-0777/nlsi_telemetry, 1.0)"
                  )
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status not in (200, 201):
                      sys.exit(
                          f"Unexpected Discord API status: {response.status}"
                      )

              print(f"Discord announcement sent for release {tag}.")

          except urllib.error.HTTPError as error:
              # Never print the token or the Authorization header.
              print(
                  f"Discord API request failed: HTTP {error.code}.",
                  file=sys.stderr
              )

              if error.code == 401:
                  print(
                      "The bot token is invalid or has been reset. "
                      "Update DISCORD_BOT_TOKEN.",
                      file=sys.stderr
                  )
              elif error.code == 403:
                  print(
                      "The bot lacks permission to post in this channel. "
                      "Check View Channel, Send Messages, and Embed Links.",
                      file=sys.stderr
                  )
              elif error.code == 404:
                  print(
                      "The channel was not found or the bot cannot access it. "
                      "Check DISCORD_CHANNEL_ID and the bot's server membership.",
                      file=sys.stderr
                  )
              else:
                  try:
                      details = error.read(1000).decode(
                          "utf-8", errors="replace"
                      )
                      print(details, file=sys.stderr)
                  except Exception:
                      pass

              sys.exit(1)

          except urllib.error.URLError as error:
              print(
                  f"Could not connect to Discord API: {error.reason}",
                  file=sys.stderr
              )
              sys.exit(1)
          PY

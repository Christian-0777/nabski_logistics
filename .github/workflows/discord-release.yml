      - name: Send release notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        continue-on-error: true
        run: |
          python3 - <<'PY'
          ...
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  if not 200 <= response.status < 300:
                      print(f"Discord rejected the notification (HTTP {response.status}).", file=sys.stderr)
                      try:
                          body = response.read().decode("utf-8", errors="replace")
                          if body:
                              print("Response body:", body, file=sys.stderr)
                      except Exception:
                          pass
                      try:
                          headers = dict(response.getheaders())
                          print("Response headers:", headers, file=sys.stderr)
                      except Exception:
                          pass
                      sys.exit(1)
          except urllib.error.HTTPError as error:
              print(f"Discord rejected the notification (HTTP {error.code}).", file=sys.stderr)
              try:
                  err_body = error.read().decode("utf-8", errors="replace")
                  if err_body:
                      print("Error body:", err_body, file=sys.stderr)
              except Exception:
                  pass
              try:
                  print("Response headers:", error.headers, file=sys.stderr)
              except Exception:
                  pass
              sys.exit(1)
          except urllib.error.URLError as e:
              print("Could not connect to the Discord webhook.", file=sys.stderr)
              print(f"URLError details: {e}", file=sys.stderr)
              sys.exit(1)
          except (TimeoutError, ValueError) as e:
              print("The Discord webhook request could not be completed.", file=sys.stderr)
              print(f"Details: {e}", file=sys.stderr)
              sys.exit(1)
          ...
          PY

name: Discord Release Announcement

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest

    steps:
      - name: Announce GitHub Release on Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          REPOSITORY: ${{ github.repository }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ["DISCORD_WEBHOOK_URL"]
          name = os.environ.get("RELEASE_NAME") or os.environ["RELEASE_TAG"]
          tag = os.environ["RELEASE_TAG"]
          url = os.environ["RELEASE_URL"]
          body = os.environ.get("RELEASE_BODY") or "No release notes provided."
          repo = os.environ["REPOSITORY"]
          prerelease = os.environ.get("IS_PRERELEASE") == "true"

          # Keep the Discord embed within its description limit.
          body = body[:3500]
          title = f"{'🧪 Beta Release' if prerelease else '🚀 New Release'}: {name}"
          if len(title) > 256:
              title = title[:253] + "..."

          payload = {
              "username": "NLSI Release Bot",
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": title,
                  "url": url,
                  "description": body,
                  "color": 15158332 if prerelease else 5763719,
                  "fields": [
                      {"name": "Version", "value": f"`{tag}`", "inline": True},
                      {"name": "Repository", "value": repo, "inline": True}
                  ],
                  "footer": {"text": "NLSI Exclusive Logbook • GitHub Releases"}
              }]
          }

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(
                      f"Discord webhook failed with HTTP {response.status}"
                  )

          print(f"Release announcement sent for {tag}")
          PY
